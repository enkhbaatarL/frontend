  /api/v1/admin/company-management/company:
    post:
      summary: 고객사 등록
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                companyCd:
                  type: string
                  description: 회사 코드
                companyNm:
                  type: string
                  description: 회사 이름
                usageBeginDate:
                  type: string
                  description: 사용 시작 날짜
                usageEndDate:
                  type: string
                  description: 사용 종료 날짜
              required:
                - companyCd
                - companyNm
                - usageBeginDate
                - usageEndDate
      responses:
        '200':
          description: 고객사 등록 성공
          content:
            application/json:
              schema:
