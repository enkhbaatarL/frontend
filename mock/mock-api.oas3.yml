openapi: 3.0.0
info:
  title: Sample API
  version: 1.0.0
paths:
  /api/v1/sample/user-info:
    get:
      summary: Get a list of users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    email:
                      type: string
              example:
                - name: John Doe
                  email: john.doe@example.com
                - name: Jane Smith
                  email: jane.smith@example.com
  /api/v1/companies:
