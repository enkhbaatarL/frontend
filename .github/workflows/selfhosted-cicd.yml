name: DEMO-selfhosted-build-push-deploy
on:
  push:
    branches: [ "demo" ]

concurrency:
  group: selfhosted-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: mi-frontend
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_REPO: skmidemoacr.azurecr.io
  IMAGE_SHA: ${{ github.sha }}
  BRANCH_TAG: ${{ github.ref_name }}-latest
  COMPOSE_DIR: ${{ secrets.COMPOSE_DIR_FRONTEND || '/opt/app' }}
  ACR_USER_NAME: ${{ secrets.ACR_USERNAME }}
  ACR_USER_PASS: ${{ secrets.ACR_PASSWORD }}

jobs:
  build-push-deploy:
    runs-on: self-hosted
    permissions:
      id-token: write     # OIDC(Azure)용
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- 레지스트리 로그인 (옵션 A: ACR Admin 계정) ----
      - name: Docker login ACR (admin)
        if: ${{ env.ACR_USER_NAME && env.ACR_USER_PASS }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USER_NAME }}
          password: ${{ env.ACR_USER_PASS }}

      - name: Derive image tags
        id: tags
        run: |
          set -eux
          echo "sha=${ACR_LOGIN_SERVER}/${ACR_REPO}:${IMAGE_SHA}" >> $GITHUB_OUTPUT
          echo "br=${ACR_LOGIN_SERVER}/${ACR_REPO}:${BRANCH_TAG}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "latest=${ACR_LOGIN_SERVER}/${ACR_REPO}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push (multi-stage Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.br }}
            ${{ steps.tags.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_PROFILE=prod
            VITE_USE_EXTERNAL_LOGIN=true

      - name: Ensure compose directory & .env
        run: |
          set -eux
          mkdir -p "${COMPOSE_DIR}"
          touch "${COMPOSE_DIR}/.env"   # 없으면 생성만

      - name: Update .env with new IMAGE tag (persist)
        run: |
          set -eux
          cd "${COMPOSE_DIR}"
          NEW_IMAGE="${{ steps.tags.outputs.sha }}"
          # .env에 IMAGE= 라인이 있으면 치환, 없으면 추가
          if grep -qE '^IMAGE=' .env; then
            sed -i "s|^IMAGE=.*|IMAGE=${NEW_IMAGE}|" .env
          else
            echo "IMAGE=${NEW_IMAGE}" >> .env
          fi
          echo "----- .env after update -----"
          cat .env

      - name: Pull image(s) locally (optional warm-up)
        run: |
          set -eux
          docker pull "${{ steps.tags.outputs.sha }}" || true
          docker pull "${{ steps.tags.outputs.br }}" || true
          if [ -n "${{ steps.tags.outputs.latest }}" ]; then
            docker pull "${{ steps.tags.outputs.latest }}" || true
          fi

      - name: Deploy with Docker Compose (apply updated .env)
        run: |
          set -eux
          cd "${COMPOSE_DIR}"
          # 설정만 바뀐 경우에도 확실히 적용
          docker compose up -d --pull always

      - name: Wait for healthcheck (app)
        run: |
          set -eux
          NAME="mi-frontend"
          TIMEOUT=180; waited=0
          until [ "$(docker inspect --format='{{.State.Health.Status}}' ${NAME} 2>/dev/null || echo unknown)" = "healthy" ]; do
            sleep 5; waited=$((waited+5))
            if [ $waited -ge $TIMEOUT ]; then
              echo "Health check timeout for ${NAME} after ${TIMEOUT}s"
              docker compose logs --no-color --tail=200 || true
              exit 1
            fi
          done

      - name: Cleanup dangling images
        run: docker image prune -f
